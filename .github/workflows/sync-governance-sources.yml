name: Sync governance sources

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-governance-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize the public snapshot
        id: sync
        run: |
          python3 plugins/challow-governance-guide/skills/challow-governance-guide/scripts/sync_sources.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated files
        run: |
          python3 -m py_compile plugins/challow-governance-guide/skills/challow-governance-guide/scripts/sync_sources.py
          python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
          python3 -m json.tool plugins/challow-governance-guide/.codex-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/challow-governance-guide/skills/challow-governance-guide/references/source-manifest.json > /dev/null
          git diff --check

      - name: Create or update the review pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/sync-governance-sources"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add plugins/challow-governance-guide
          git commit -m "Update governance source snapshot"
          git push --force-with-lease --set-upstream origin "$branch"
          existing_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$existing_url" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update governance source snapshot" \
              --body "Automated synchronization of the public Challow governance sources. Review the document changes before merging."
          else
            echo "Updated existing pull request: $existing_url"
          fi
